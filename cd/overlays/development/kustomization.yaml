apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: otterscan-dev

resources:
  - ../../base
  - backendpolicy.yaml
  - configmap.yaml
  - httproute.yaml

# Kept deployable but idle: production Otterscan covers mainnet and testnet, and a bot pulled this copy's
# bundle through the uncached GKE Gateway (~5 GiB/day of inter-region egress). Scale up when needed.
replicas:
  - name: otterscan
    count: 0

patches:
  # Autopilot bills requests: explicit CPU and memory (measured use ~1m CPU)
  - target:
      kind: Deployment
      name: otterscan
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 50m
            memory: 100Mi
          limits:
            memory: 200Mi
  - target:
      kind: Deployment
      name: otterscan
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: network-config
            configMap:
              name: otterscan
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - mountPath: /usr/share/nginx/html/config.json
            readOnly: true
            name: network-config
            subPath: config.json
